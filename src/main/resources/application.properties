spring.application.name=roombooking
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/roombooking
spring.datasource.username=postgres
spring.datasource.password=rama
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Redis Caching Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Fallback to standard in-memory caching if Redis isn't running by setting spring.cache.type to none/simple inside config if connection fails. 
# We'll programmatically make it robust!

# Mail Configuration (Async Email Notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration Secrets
hotel.app.jwtSecret=======================HotelBookingSystemSecretKeyJWTTokenVeryLongKeyForHS256Algorithm======================
hotel.app.jwtExpirationMs=86400000

# File Upload / Multipart properties if needed
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.hotelbooking.roombooking=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n